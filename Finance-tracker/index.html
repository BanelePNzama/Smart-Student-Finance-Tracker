<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Student Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap (optional but helpful) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="src/styles.css">
</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width:240px; min-height:100vh;">
        <h4 class="text-center mb-4">Finance App</h4>
        <ul class="nav nav-pills flex-column gap-2">
            <li class="nav-item">
                <a class="nav-link active" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">Income</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">Expenses</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">Reports</a>
            </li>
        </ul>
    </div>
<div class="flex-fill p-4 bg-light">
    <div class="container py-4">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">🎓 Smart Student Finance Tracker</h1>
            <p class="text-muted">Track your bursary money & expenses</p>
        </div>

        <!-- Dashboard -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6>Total Income</h6>
                        <h3 id="totalIncome">R0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6>Total Expenses</h6>
                        <h3 id="totalExpenses">R0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6>Remaining Balance</h6>
                        <h3 id="balance">R0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Income -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5>Add Income</h5>
                <form id="incomeForm" class="row g-2">
                    <div class="col-md-5">
                        <input type="text" id="incomeSource" class="form-control"
                            placeholder="Source (NSFAS, Company X)" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" id="incomeAmount" class="form-control" placeholder="Amount" required>
                    </div>
                    <div class="col-md-3 d-grid">
                        <button class="btn btn-success">Add Income</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Expense -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5>Add Expense</h5>
                <form id="expenseForm" class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="expenseName" class="form-control" placeholder="Expense Name" required>
                    </div>
                    <div class="col-md-3">
                        <select id="expenseCategory" class="form-select">
                            <option>Food</option>
                            <option>Transport</option>
                            <option>Data</option>
                            <option>Books</option>
                            <option>Rent</option>
                            <option>Shopping</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="number" id="expenseAmount" class="form-control" placeholder="Amount" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button class="btn btn-danger">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Expense List -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Expense History</h5>
                <ul id="expenseList" class="list-group list-group-flush">
                    <!-- Expenses will appear here -->
                </ul>
            </div>
        </div>

    </div>
</div>
</div>

    <script src="src/app.js"></script>
</body>

</html>
